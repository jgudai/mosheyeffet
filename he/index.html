function u(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})}
function unwrap(pw,j){
  if(j>=D.w.length)return Promise.reject(0);var w=D.w[j];
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:u(w.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  }).then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:u(w.i)},key,u(w.k))}).catch(function(){return unwrap(pw,j+1)});
}
function open(pw,quiet){
  return unwrap(pw,0).then(function(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"])})
  .then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c))}).then(function(buf){
    try{localStorage.setItem("moshe_pw",pw)}catch(e){}
    var h=new TextDecoder().decode(buf);document.open();document.write(h);document.close();
  }).catch(function(){if(!quiet){document.getElementById("err").textContent="הסיסמה אינה נכונה. נסו שוב.";document.getElementById("pw").select();}else{try{localStorage.removeItem("moshe_pw")}catch(e){}}});
}
var saved=null;try{saved=localStorage.getItem("moshe_pw")}catch(e){}
if(saved)open(saved,true);
document.getElementById("gate").addEventListener("submit",function(e){e.preventDefault();
  var v=document.getElementById("pw").value.normalize("NFC").replace(/[֑-ׇ]/g,"").replace(/\s+/g,"").toLowerCase();if(v)open(v,false);});
