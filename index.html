var DAY=864e5, KEEP=30*DAY, SK="moshe_unlock";
function u(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})}
function b64(buf){var a=new Uint8Array(buf),s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function unwrap(pw,j){
  if(j>=D.w.length)return Promise.reject(0);var w=D.w[j];
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:u(w.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  }).then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:u(w.i)},key,u(w.k))}).catch(function(){return unwrap(pw,j+1)});
}
function show(raw,remember){
  return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]).then(function(key){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
  }).then(function(buf){
    if(remember){try{localStorage.setItem(SK,JSON.stringify({k:b64(raw),exp:Date.now()+KEEP}));localStorage.removeItem("moshe_pw")}catch(e){}}
    if(location.hash.indexOf("k=")>-1){try{history.replaceState(null,"",location.pathname+"#"+location.hash.slice(1).split("&")[0])}catch(e){}}
    var h=new TextDecoder().decode(buf);
    var go=function(){document.open();document.write(h);document.close();};
    if(document.readyState==="complete")setTimeout(go,0);else window.addEventListener("load",function(){setTimeout(go,0)});
  });
}
function fail(){document.getElementById("err").textContent="That isn't quite right. Please try again.";document.getElementById("pw").select();}
function tryPw(pw,quiet){return unwrap(pw,0).then(function(raw){return show(raw,true)}).catch(function(){if(!quiet)fail();})}
// 1) unlock handed over in the link (#...&k=KEY)
var m=location.hash.match(/[#&]k=([A-Za-z0-9+\/=_-]+)/);
var stored=null;try{stored=JSON.parse(localStorage.getItem(SK)||"null")}catch(e){}
if(stored&&!(stored.exp>Date.now())){try{localStorage.removeItem(SK)}catch(e){};stored=null}
if(m){show(u(decodeURIComponent(m[1]).replace(/-/g,"+").replace(/_/g,"/")),true).catch(function(){})}
else if(stored){show(u(stored.k),false).catch(function(){try{localStorage.removeItem(SK)}catch(e){}})}
else{var old=null;try{old=localStorage.getItem("moshe_pw")}catch(e){};if(old)tryPw(old,true)}
document.getElementById("gate").addEventListener("submit",function(e){e.preventDefault();
  var v=document.getElementById("pw").value.normalize("NFC").replace(/[֑-ׇ]/g,"").replace(/\s+/g,"").toLowerCase();if(v)tryPw(v,false);});
})();
